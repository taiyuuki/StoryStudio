[package]
name = "story-studio-app"
version = "0.1.0"
description = "StoryStudio 桌面端 — 小说创作工作台"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "story_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

story-project-format = { workspace = true }
story-studio-lib = { workspace = true }
story-compiler = { workspace = true }
story-ai-runtime = { workspace = true }

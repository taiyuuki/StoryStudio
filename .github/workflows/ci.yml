name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust 库测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 桌面壳（story-studio-app）在前端 job 编译检查：tauri 的
      # generate_context! 编译期读取 frontendDist，必须先产出前端 dist
      - name: 运行库 crate 测试
        run: >
          cargo test -p story-ir -p story-project-format -p story-parser
          -p story-compiler -p story-knowledge -p story-exporter
          -p story-ai-runtime -p story-studio-lib -p story-mcp -p story-studio

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy 检查（警告即失败）
        run: >
          cargo clippy -p story-ir -p story-project-format -p story-parser
          -p story-compiler -p story-knowledge -p story-exporter
          -p story-ai-runtime -p story-studio-lib -p story-mcp -p story-studio
          --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 格式检查
        run: cargo fmt --all --check

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npx vue-tsc --noEmit
      - run: pnpm build
      # 桌面壳编译检查：依赖上一步产出的 dist/；Linux 下 tauri 需 webkit 系统库
      - name: 安装桌面壳编译所需系统库
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译检查桌面壳（story-studio-app）
        working-directory: .
        run: cargo check -p story-studio-app
